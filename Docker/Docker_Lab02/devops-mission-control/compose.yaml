name: devops-mission-control

services:
  ui:
    build: ./ui
    image: mission-control-ui:1.0
    ports:
      - "8080:80"
    depends_on:
      gateway:
        condition: service_started
    networks: [frontnet]

  gateway:
    build: ./gateway
    image: mission-control-gateway:1.0
    depends_on:
      incidents:
        condition: service_healthy
      tasks:
        condition: service_healthy
    networks: [frontnet, backnet]

  incidents:
    build: ./services/incidents
    image: mission-control-incidents:1.0
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://mission:missionpass@db:5432/mission
      REDIS_URL: redis://cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [backnet]

  tasks:
    build: ./services/tasks
    image: mission-control-tasks:1.0
    environment:
      DATABASE_URL: postgresql://mission:missionpass@db:5432/mission
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [backnet]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mission
      POSTGRES_USER: mission
      POSTGRES_PASSWORD: missionpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission -d mission"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backnet]

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backnet]

volumes:
  postgres-data:
  redis-data:

networks:
  frontnet:
  backnet:
    internal: true
