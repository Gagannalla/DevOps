server {
  listen 80;
  server_name _;
  location = /api/health/incidents {
    proxy_pass http://incidents:3001/health;
  }
  location = /api/health/tasks {
    proxy_pass http://tasks:3002/health;
  }
  location /api/incidents {
    proxy_pass http://incidents:3001/incidents;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/tasks {
    proxy_pass http://tasks:3002/tasks;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
